<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>myACSHS | SIS v18.0</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /** * MINIMALIST DESIGN SYSTEM 
         * Focus: High contrast, sharp edges, professional utility.
         */
        :root {
            --primary: #000000;
            --secondary: #64748b;
            --error: #e11d48;
            --surface: #ffffff;
            --bg: #ffffff;
            --border: #e2e8f0;
            --radius: 0px; /* Sharp corners for minimalist look */
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--primary); }

        /* SHARED UI COMPONENTS */
        .container { max-width: 480px; margin: 0 auto; padding: 20px; }
        .panel { display: none; width: 100%; animation: fadeIn 0.3s ease; }
        .panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px 0; border-bottom: 2px solid var(--primary); margin-bottom: 40px;
        }
        .logo h2 { font-weight: 800; font-size: 24px; letter-spacing: -1px; }

        /* MINIMALIST LOGIN FORM */
        .form-title { margin-bottom: 30px; }
        .form-title h1 { font-size: 32px; font-weight: 800; }
        .form-title p { color: var(--secondary); font-size: 14px; }

        .form-group { margin-bottom: 20px; position: relative; }
        .form-group label { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; }
        
        input, select {
            width: 100%; height: 54px; padding: 0 15px; border: 2px solid var(--border);
            border-radius: var(--radius); font-size: 16px; outline: none; transition: 0.2s;
            background: #fff;
        }
        input:focus { border-color: var(--primary); }

        /* ERROR STATE (Facebook-logic in Minimalist style) */
        .form-group.has-error input {
            border-color: var(--error) !important;
            background: #fffafa;
            animation: shake 0.2s 2;
        }
        .error-note {
            color: var(--error); font-size: 12px; font-weight: 600;
            margin-top: 6px; display: none;
        }
        .form-group.has-error .error-note { display: block; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        /* BUTTONS */
        .btn-black { 
            width: 100%; height: 56px; background: var(--primary); color: #fff; 
            border: none; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.2s;
        }
        .btn-black:active { transform: translateY(1px); opacity: 0.9; }
        .btn-ghost { 
            width: 100%; background: none; border: 2px solid var(--border); 
            height: 50px; margin-top: 15px; font-weight: 700; cursor: pointer;
        }

        /* DASHBOARD ELEMENTS */
        .nav-tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 30px; }
        .tab { 
            flex: 1; padding: 15px; text-align: center; color: var(--secondary); 
            cursor: pointer; font-weight: 700; border-bottom: 3px solid transparent;
        }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab i { font-size: 20px; }

        .pfp-wrap { width: 100px; height: 100px; border: 3px solid var(--primary); margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .pfp-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .pfp-wrap i { font-size: 40px; color: var(--border); }

        .data-card { border: 1px solid var(--border); padding: 15px; margin-bottom: 12px; }
        .data-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
        .data-row:last-child { border-bottom: none; }
        .tag-time { background: var(--primary); color: #fff; padding: 4px 8px; font-size: 10px; font-weight: 700; }

        /* NOTIFICATIONS */
        .notif-pill { position: relative; }
        .notif-dot { position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; background: var(--error); border-radius: 50%; display: none; }
        .notif-item { padding: 12px; border-left: 4px solid var(--border); margin-bottom: 10px; background: #f8fafc; cursor: pointer; }
        .notif-item.unread { border-left-color: var(--primary); background: #fff; }

        #spinner-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.9); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .spinner { width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="spinner-overlay"><div class="spinner"></div></div>

<div class="container">
    
    <header id="appHeader" style="visibility:hidden">
        <div class="logo"><h2>myACSHS</h2></div>
        <div style="display:flex; gap:20px; align-items:center">
            <div class="notif-pill" onclick="app.tab('notif', document.getElementById('tabNotifIcon'))">
                <i class="fa-solid fa-bell"></i>
                <span id="badge" class="notif-dot"></span>
            </div>
            <i class="fa-solid fa-power-off" onclick="app.logout()"></i>
        </div>
    </header>

    <div id="pAuth" class="panel active">
        <div id="vLogin">
            <div class="form-title">
                <h1>Login</h1>
                <p>Student Information System</p>
            </div>
            <div class="form-group" id="wrapRole">
                <label>Access Role</label>
                <select id="lRole">
                    <option value="student">Student Account</option>
                    <option value="admin">Administrator</option>
                </select>
            </div>
            <div class="form-group" id="wrapId">
                <label>Identification Number</label>
                <input type="text" id="lId" placeholder="ID Number">
                <div class="error-note">Wrong ID Number. Please try again.</div>
            </div>
            <div class="form-group" id="wrapPass">
                <label>Password</label>
                <input type="password" id="lPass" placeholder="••••••••">
                <div class="error-note">Wrong Password. Please try again.</div>
            </div>
            <button class="btn-black" onclick="app.login()">Sign In</button>
            <button class="btn-ghost" onclick="ui.subAuth('vReg')">Create Account</button>
        </div>

        <div id="vReg" style="display:none">
            <div class="form-title"><h1>Register</h1><p>New Student Identity</p></div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
                <div class="form-group"><label>First Name</label><input type="text" id="rF"></div>
                <div class="form-group"><label>Last Name</label><input type="text" id="rL"></div>
            </div>
            <div class="form-group"><label>8-Digit ID</label><input type="number" id="rId"></div>
            <div class="form-group"><label>6-Digit Slip</label><input type="number" id="rSlip"></div>
            <div class="form-group"><label>Strand/Section</label><input type="text" id="rT" placeholder="e.g. ICT 1202"></div>
            <div class="form-group"><label>Password</label><input type="password" id="rP"></div>
            <button class="btn-black" onclick="app.register()">Create Profile</button>
            <button class="btn-ghost" onclick="ui.subAuth('vLogin')">Back to Login</button>
        </div>
    </div>

    <div id="pDash" class="panel">
        <div class="nav-tabs">
            <div class="tab active" onclick="app.tab('home', this)"><i class="fa-solid fa-house-chimney"></i></div>
            <div class="tab" onclick="app.tab('grades', this)"><i class="fa-solid fa-scroll"></i></div>
            <div class="tab" id="tabNotifIcon" onclick="app.tab('notif', this)"><i class="fa-solid fa-envelope-open-text"></i></div>
            <div class="tab" id="tabAdmin" style="display:none" onclick="app.tab('admin', this)"><i class="fa-solid fa-lock"></i></div>
        </div>

        <div id="dashContent">
            </div>
    </div>

</div>

<script>
    /**
     * @constant ACADEMIC_CONFIG
     */
    const SLIPS = ["112233", "445566", "123456", "654321", "224466"];
    const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
    const SCHEDULE = {
        "Monday": [{t: "06:15-07:15", s: "MIL / Homeroom", r: "R101"}, {t: "07:15-08:15", s: "JAVA", r: "CL1"}, {t: "08:35-11:35", s: "Immersion", r: "Field"}],
        "Tuesday": [{t: "06:15-07:15", s: "MIL", r: "R101"}, {t: "07:15-08:15", s: "JAVA", r: "CL1"}, {t: "08:35-11:35", s: "Immersion", r: "Field"}],
        "Wednesday": [{t: "06:15-08:15", s: "Research / III", r: "Lib"}, {t: "08:35-11:35", s: "Immersion", r: "Field"}],
        "Thursday": [{t: "06:15-08:15", s: "JAVA", r: "CL1"}, {t: "08:35-11:35", s: "Immersion", r: "Field"}],
        "Friday": [{t: "06:15-08:15", s: "PE / Health", r: "Gym"}, {t: "08:35-11:35", s: "Immersion", r: "Field"}]
    };

    const db = {
        save: (k,v) => localStorage.setItem('sis18_'+k, JSON.stringify(v)),
        get: (k) => JSON.parse(localStorage.getItem('sis18_'+k) || '[]'),
        sess: {
            set: (u) => localStorage.setItem('sis_sess', JSON.stringify(u)),
            get: () => JSON.parse(localStorage.getItem('sis_sess')),
            kill: () => localStorage.removeItem('sis_sess')
        }
    };

    const ui = {
        go: (id) => {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        },
        subAuth: (id) => {
            vLogin.style.display = id === 'vLogin' ? 'block' : 'none';
            vReg.style.display = id === 'vReg' ? 'block' : 'none';
        },
        load: (s) => document.getElementById('spinner-overlay').style.display = s ? 'flex' : 'none'
    };

    const app = {
        me: null,
        day: DAYS[new Date().getDay() - 1] || "Monday",
        notifs: [],

        init: () => {
            const s = db.sess.get();
            if(s) { app.me = s; app.launch(); }
        },

        login: () => {
            const r = lRole.value, id = lId.value.trim(), p = lPass.value.trim();
            wrapId.classList.remove('has-error'); wrapPass.classList.remove('has-error');

            ui.load(true);
            setTimeout(() => {
                ui.load(false);
                if(r === 'admin') {
                    if(id === 'admin' && p === 'admin123') {
                        app.me = { role:'admin', name:'System Faculty', id:'ADMIN-ROOT' };
                    } else {
                        if(id !== 'admin') wrapId.classList.add('has-error'); else wrapPass.classList.add('has-error');
                        return;
                    }
                } else {
                    const u = db.get('u').find(x => x.id === id);
                    if(!u) return wrapId.classList.add('has-error');
                    if(u.p !== p) return wrapPass.classList.add('has-error');
                    app.me = { role:'student', ...u, name: u.f+' '+u.l };
                }
                db.sess.set(app.me);
                app.launch();
            }, 700);
        },

        register: () => {
            const id = rId.value, slip = rSlip.value;
            if(id.length !== 8 || slip.length !== 6 || !SLIPS.includes(slip)) return alert("Data Validation Failed.");
            let users = db.get('u');
            if(users.some(x => x.id === id)) return alert("ID already exists.");

            ui.load(true);
            setTimeout(() => {
                users.push({ id, slip, f:rF.value, l:rL.value, p:rP.value, t:rT.value, pic:null, 
                    grades: { "MIL": 92, "JAVA": 88, "Research": 95, "Immersion": 96 } });
                db.save('u', users);
                ui.load(false);
                alert("Account Created.");
                ui.subAuth('vLogin');
            }, 800);
        },

        launch: () => {
            ui.go('pDash');
            appHeader.style.visibility = 'visible';
            tabAdmin.style.display = app.me.role === 'admin' ? 'block' : 'none';
            if(app.me.role === 'student' && !app.notifs.length) {
                app.notifs = [{id:1, t:"Grade Update", d:"Final scores for Quarter 1 have been released.", read:false}];
            }
            app.tab('home', document.querySelector('.tab'));
            app.badge();
        },

        tab: (n, el) => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            app.render(n);
        },

        render: (n) => {
            let html = "";
            if(n === 'home') {
                html = `
                <div style="text-align:center; margin-bottom:30px">
                    <div class="pfp-wrap">${app.me.pic ? `<img src="${app.me.pic}">` : `<i class="fa-solid fa-user"></i>`}</div>
                    <h2 style="font-weight:800">${app.me.name}</h2>
                    <p style="color:var(--secondary); font-size:12px">${app.me.id} | ${app.me.t || 'Faculty'}</p>
                </div>
                <div class="data-card">
                    <div style="display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:10px">
                        ${DAYS.map(d => `<button onclick="app.setDay('${d}')" style="background:${d===app.day?'#000':'#eee'}; color:${d===app.day?'#fff':'#000'}; border:none; padding:8px 12px; font-size:11px; font-weight:700;">${d.toUpperCase()}</button>`).join('')}
                    </div>
                    ${(SCHEDULE[app.day] || []).map(i => `<div class="data-row"><div class="tag-time">${i.t}</div><div><b>${i.s}</b><br><small>${i.r}</small></div></div>`).join('')}
                </div>`;
            } else if(n === 'grades') {
                const g = app.me.grades || {};
                html = `<div class="data-card"><h3>Quarterly Progress</h3><div style="margin-top:15px">${Object.entries(g).map(([k,v])=>`<div class="data-row"><span>${k}</span><b>${v}</b></div>`).join('')}</div></div>`;
            } else if(n === 'notif') {
                html = `<div class="data-card"><h3>Notifications</h3><div style="margin-top:15px">` + 
                (app.notifs.map(x => `<div class="notif-item ${x.read?'':'unread'}" onclick="app.read(${x.id})"><b>${x.t}</b><br><small>${x.d}</small></div>`).join('') || '<p>No updates.</p>') + `</div></div>`;
            } else if(n === 'admin') {
                html = `<div class="data-card"><h3>Directory</h3><div style="margin-top:10px">${db.get('u').map((u,i)=>`<div class="data-row"><div><b>${u.f} ${u.l}</b><br><small>${u.id}</small></div><button onclick="app.photo(${i})" style="background:#000; color:#fff; border:none; padding:5px 10px; font-size:10px">Photo</button></div>`).join('')}</div></div>`;
            }
            dashContent.innerHTML = html;
        },

        setDay: (d) => { app.day = d; app.render('home'); },
        badge: () => { const c = app.notifs.filter(x=>!x.read).length; badge.style.display = c > 0 ? 'block' : 'none'; },
        read: (id) => { const n = app.notifs.find(x=>x.id===id); if(n) n.read=true; app.badge(); app.render('notif'); },
        photo: (idx) => {
            const f = document.createElement('input'); f.type = 'file';
            f.onchange = e => {
                const r = new FileReader();
                r.onload = ev => {
                    let u = db.get('u'); u[idx].pic = ev.target.result; db.save('u', u);
                    if(app.me.id === u[idx].id) { app.me.pic = ev.target.result; db.sess.set(app.me); }
                    app.render('admin');
                };
                r.readAsDataURL(e.target.files[0]);
            };
            f.click();
        },
        logout: () => { if(confirm("Logout?")) { db.sess.kill(); location.reload(); } }
    };

    window.onload = app.init;
</script>
</body>
</html>
