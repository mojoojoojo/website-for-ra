<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>myACSHS Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
  :root {
    --bg: #ffffff;
    --ui-soft: #f4f4f7;
    --text: #1a1a1b;
    --text-mid: #65676b;
    --accent: #000000;
    --border: #eeeeee;
    --radius: 12px;
  }

  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; margin: 0; padding: 0; }
  
  body { 
    font-family: 'Inter', sans-serif; 
    background-color: var(--bg); 
    color: var(--text); 
    line-height: 1.4;
    font-size: 14px; /* Standard mobile base size */
  }

  .wrapper { width: 100%; max-width: 1000px; margin: 0 auto; padding: 15px; }

  /* HEADER - COMPACT */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0 20px 0;
  }
  .brand { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .brand img { width: 28px; height: 28px; border-radius: 4px; }

  /* COMPACT AUTH FORMS */
  .auth-box {
    max-width: 360px;
    margin: 40px auto;
    padding: 20px;
  }
  .auth-box h2 { font-size: 22px; margin-bottom: 20px; text-align: center; font-weight: 700; }

  .field { margin-bottom: 15px; }
  .field label { display: block; font-size: 11px; font-weight: 700; color: var(--text-mid); text-transform: uppercase; margin-bottom: 4px; }
  
  input, select {
    width: 100%; height: 44px; padding: 0 12px; border-radius: 8px;
    border: 1px solid var(--border); font-size: 16px; outline: none; background: var(--ui-soft);
  }

  .btn {
    width: 100%; height: 44px; border-radius: 8px; border: none; font-weight: 600;
    font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-dark { background: var(--accent); color: #fff; }
  .btn-text { background: transparent; color: var(--text-mid); font-size: 12px; text-decoration: underline; margin-top: 10px; }

  /* DASHBOARD GRID */
  .dash-layout {
    display: grid;
    grid-template-columns: 1fr 240px;
    gap: 30px;
  }

  /* PROFILE - TOP LEFT & RESPONSIVE SIZE */
  .profile-header {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
  }
  .p-photo {
    width: 100px; height: 100px; /* PC Size */
    border-radius: 12px;
    background: var(--ui-soft);
    border: 1px solid var(--border);
    overflow: hidden;
    flex-shrink: 0;
  }
  .p-photo img { width: 100%; height: 100%; object-fit: cover; }
  .p-photo .empty { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #ccc; font-size: 32px; }

  .p-info h1 { font-size: 22px; font-weight: 700; }
  .p-info p { color: var(--text-mid); font-size: 13px; }

  /* TABS - MOBILE FRIENDLY SCROLL */
  .tab-nav { 
    display: flex; 
    gap: 20px; 
    border-bottom: 1px solid var(--border); 
    margin-bottom: 20px; 
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .tab-nav button {
    padding: 10px 0; border: none; background: none; cursor: pointer;
    font-size: 13px; font-weight: 600; color: var(--text-mid); border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab-nav button.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* DATA LISTS (Replaces heavy tables on mobile) */
  .list-item {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .list-item b { font-size: 14px; }
  .list-item span { font-size: 12px; color: var(--text-mid); }

  /* SIDEBAR STATS */
  .side-card { padding: 15px; background: var(--ui-soft); border-radius: 10px; margin-bottom: 10px; }
  .side-label { font-size: 10px; font-weight: 700; color: var(--text-mid); text-transform: uppercase; }
  .side-val { font-size: 20px; font-weight: 700; }

  /* MOBILE FIXES */
  @media (max-width: 768px) {
    .dash-layout { grid-template-columns: 1fr; }
    .side-area { display: flex; gap: 10px; }
    .side-card { flex: 1; margin-bottom: 0; }
    .p-photo { width: 80px; height: 80px; } /* Smaller for phone */
    .p-info h1 { font-size: 18px; }
  }

  @media (max-width: 480px) {
    .wrapper { padding: 10px; }
    header { margin-bottom: 20px; }
    .brand { font-size: 16px; }
    .btn { height: 40px; font-size: 13px; }
    input { height: 40px; font-size: 14px; }
  }
</style>
</head>
<body>

<div class="wrapper">
  <header>
    <div class="brand"><img src="acshslogo.jpg" alt="L"> myACSHS</div>
    <button class="btn btn-dark" id="loBtn" style="display:none; width:auto; padding:0 12px; height:32px; font-size:11px" onclick="app.logout()">Logout</button>
  </header>

  <div id="authPanel">
    <div id="view-login" class="auth-box">
      <h2>Sign In</h2>
      <div class="field"><label>Role</label><select id="liRole"><option value="student">Student</option><option value="admin">Admin</option></select></div>
      <div class="field"><label>ID Number</label><input type="text" id="liId" placeholder="ID"></div>
      <div class="field"><label>Password</label><input type="password" id="liPass" placeholder="••••"></div>
      <button class="btn btn-dark" onclick="app.login()">Login</button>
      <div style="text-align:center">
        <button class="btn btn-text" onclick="ui.goto('view-forgot')">Forgot Password?</button>
        <button class="btn btn-text" onclick="ui.goto('view-reg')">Create Account</button>
      </div>
    </div>

    <div id="view-reg" class="auth-box" style="display:none">
      <h2>Register</h2>
      <div class="field"><label>Name</label><div style="display:flex;gap:5px"><input id="rgF" placeholder="First"><input id="rgL" placeholder="Last"></div></div>
      <div class="field"><label>Student ID</label><input id="rgId"></div>
      <div class="field"><label>Enrollment Order No.</label><input type="number" id="rgOrder"></div>
      <div class="field"><label>Strand</label><input id="rgT"></div>
      <div class="field"><label>Password</label><input type="password" id="rgP"></div>
      <button class="btn btn-dark" onclick="app.register()">Register</button>
      <button class="btn btn-text" style="width:100%" onclick="ui.goto('view-login')">Back</button>
    </div>

    <div id="view-forgot" class="auth-box" style="display:none">
      <h2>Reset</h2>
      <div class="field"><label>ID</label><input id="fId"></div>
      <div class="field"><label>Enrollment No.</label><input type="number" id="fOrder"></div>
      <div class="field"><label>New Password</label><input type="password" id="fP"></div>
      <button class="btn btn-dark" onclick="app.reset()">Update</button>
      <button class="btn btn-text" style="width:100%" onclick="ui.goto('view-login')">Cancel</button>
    </div>
  </div>

  <main id="dashPanel" style="display:none">
    <div class="dash-layout">
      <div class="main-area">
        <div class="profile-header">
          <div id="uPhoto" class="p-photo"></div>
          <div class="p-info">
            <h1 id="uTitle">...</h1>
            <p id="uSub">...</p>
          </div>
        </div>
        <nav class="tab-nav" id="tList"></nav>
        <div id="view-port"></div>
      </div>

      <div class="side-area">
        <div class="side-card">
          <div class="side-label">Students</div>
          <div id="countPop" class="side-val">0</div>
        </div>
        <div class="side-card">
          <div class="side-label">Status</div>
          <div class="side-val" style="font-size:14px; color:green">Active</div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
const ds = {
  get: (k) => JSON.parse(localStorage.getItem('min_v2_'+k) || '[]'),
  set: (k, v) => localStorage.setItem('min_v2_'+k, JSON.stringify(v)),
  sess: {
    put: (v) => localStorage.setItem('min_sess', JSON.stringify(v)),
    get: () => JSON.parse(localStorage.getItem('min_sess')),
    off: () => localStorage.removeItem('min_sess')
  }
};

const ui = {
  goto: (id) => {
    ['view-login', 'view-reg', 'view-forgot'].forEach(v => {
      const el = document.getElementById(v); if(el) el.style.display='none';
    });
    document.getElementById(id).style.display='block';
  }
};

const app = {
  me: null,
  init: () => {
    const s = ds.sess.get(); if(s) { app.me = s; app.run(); }
    app.updatePop();
  },
  register: () => {
    const u = ds.get('u');
    u.push({ id:rgId.value, f:rgF.value, l:rgL.value, o:rgOrder.value, t:rgT.value, p:rgP.value, pic:null });
    ds.set('u', u); alert("Done!"); ui.goto('view-login'); app.updatePop();
  },
  login: () => {
    const r = liRole.value, id = liId.value, p = liPass.value;
    if(r==='admin' && id==='admin' && p==='admin') app.me = {role:'admin', name:'Admin', id:'0'};
    else {
      const x = ds.get('u').find(i => i.id === id && i.p === p);
      if(!x) return alert("Fail");
      app.me = {role:'student', ...x, name: x.f+' '+x.l};
    }
    ds.sess.put(app.me); app.run();
  },
  reset: () => {
    let u = ds.get('u'); const i = u.findIndex(x => x.id === fId.value && x.o === fOrder.value);
    if(i===-1) return alert("Verify Error");
    u[i].p = fP.value; ds.set('u', u); alert("Ok"); ui.goto('view-login');
  },
  run: () => {
    document.getElementById('authPanel').style.display = 'none';
    document.getElementById('dashPanel').style.display = 'block';
    document.getElementById('loBtn').style.display = 'block';
    document.getElementById('uTitle').innerText = app.me.name;
    document.getElementById('uSub').innerText = app.me.role==='admin'?'System Faculty':`ID: ${app.me.id} | ${app.me.t}`;
    uPhoto.innerHTML = app.me.pic ? `<img src="${app.me.pic}">` : `<div class="empty"><i class="fa-solid fa-user"></i></div>`;
    app.tabs();
  },
  tabs: () => {
    const list = document.getElementById('tList'); list.innerHTML = '';
    const menu = app.me.role==='admin' ? [['Students', app.dir], ['Schedule', app.sch]] : [['My Class', app.mySch], ['Grades', () => view-port.innerHTML='<p>Pending</p>']];
    menu.forEach(([l, f], i) => {
      const b = document.createElement('button'); b.innerText = l;
      if(i===0) { b.classList.add('active'); f(); }
      b.onclick = (e) => { document.querySelectorAll('.tab-nav button').forEach(x=>x.classList.remove('active')); e.target.classList.add('active'); f(); };
      list.appendChild(b);
    });
  },
  dir: () => {
    const u = ds.get('u');
    document.getElementById('view-port').innerHTML = u.map((x, i) => `
      <div class="list-item">
        <div><b>${x.f} ${x.l}</b><br><span>ID: ${x.id} • Slip: #${x.o}</span></div>
        <button class="btn btn-dark" style="width:auto; height:30px; padding:0 10px; font-size:10px" onclick="app.up(${i})">Edit</button>
      </div>`).join('');
  },
  mySch: () => {
    const s = ds.get('s');
    document.getElementById('view-port').innerHTML = s.map(x => `<div class="list-item"><b>${x.s}</b> <span>${x.t}</span></div>`).join('') || 'Empty';
  },
  sch: () => {
    document.getElementById('view-port').innerHTML = `<div class="field"><input id="ss" placeholder="Subject"><input id="st" placeholder="Time" style="margin-top:5px"></div><button class="btn btn-dark" onclick="app.addS()">Add</button><div id="sl" style="margin-top:10px"></div>`;
    app.listS();
  },
  addS: () => { const s = ds.get('s'); s.push({s:ss.value, t:st.value}); ds.set('s', s); app.listS(); },
  listS: () => {
    const s = ds.get('s');
    sl.innerHTML = s.map((x,i)=> `<div class="list-item"><b>${x.s}</b> <i class="fa fa-trash" onclick="app.delS(${i})"></i></div>`).join('');
  },
  delS: (i) => { let s = ds.get('s'); s.splice(i,1); ds.set('s', s); app.listS(); },
  up: (i) => {
    const f = document.createElement('input'); f.type='file'; f.onchange = e => {
      const r = new FileReader(); r.onload = ev => {
        let u = ds.get('u'); u[i].pic = ev.target.result; ds.set('u', u);
        if(app.me.id === u[i].id) { app.me.pic = ev.target.result; ds.sess.put(app.me); }
        app.run();
      }; r.readAsDataURL(e.target.files[0]);
    }; f.click();
  },
  updatePop: () => { document.getElementById('countPop').innerText = ds.get('u').length; },
  logout: () => { ds.sess.off(); location.reload(); }
};
app.init();
</script>
</body>
</html>
