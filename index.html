<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>myACSHS — Student Records System</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
  :root {
    --bg-main: #f1f5f9; --primary: #2563eb; --primary-dark: #1e40af;
    --text-main: #0f172a; --text-muted: #64748b; --card-bg: #ffffff;
    --border: #e2e8f0; --danger: #ef4444; --success: #22c55e;
    --radius-lg: 16px; --radius-md: 12px; --shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
  }

  * { box-sizing: border-box; transition: all 0.2s ease; }
  body { margin: 0; font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: var(--text-main); padding: 20px; }
  .app { width: 100%; max-width: 1200px; margin: 0 auto; }

  /* Header Styles */
  header.app-header { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
  .brand { display: flex; gap: 12px; align-items: center; }
  .brand img { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  .title { font-weight: 800; font-size: 24px; color: var(--primary); letter-spacing: -1px; }

  /* Auth UI */
  .auth-card { max-width: 420px; margin: 60px auto; background: var(--card-bg); padding: 35px; border-radius: var(--radius-lg); box-shadow: var(--shadow); border: 1px solid var(--border); }
  .auth-card h2 { margin: 0 0 10px 0; font-size: 28px; }
  
  /* Input Groups */
  .input-group { margin-bottom: 18px; position: relative; }
  .input-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--text-main); }
  input, select { width: 100%; padding: 12px 15px; border-radius: var(--radius-md); border: 1.5px solid var(--border); font-size: 15px; background: #f8fafc; }
  input:focus { outline: none; border-color: var(--primary); background: #fff; }

  /* Eye Icon */
  .pass-wrapper { position: relative; }
  .toggle-eye { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); cursor: pointer; padding: 5px; }

  /* Buttons */
  button { padding: 12px 24px; border-radius: var(--radius-md); border: none; font-weight: 700; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  button.btn-primary { background: var(--primary); color: white; width: 100%; }
  button.btn-primary:hover { background: var(--primary-dark); }
  button.btn-danger { background: #fee2e2; color: var(--danger); }
  button.btn-ghost { background: #f1f5f9; color: var(--text-muted); border: 1px solid var(--border); }

  /* Dashboard Layout */
  .dashboard-grid { display: grid; grid-template-columns: 1fr 340px; gap: 25px; }
  .content-card { background: var(--card-bg); border-radius: var(--radius-lg); padding: 30px; border: 1px solid var(--border); box-shadow: var(--shadow); }

  /* Profile Section */
  .profile-header { display: flex; gap: 25px; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 25px; }
  .avatar-container { position: relative; }
  .avatar-container img, .avatar-ph { width: 110px; height: 110px; border-radius: 22px; object-fit: cover; border: 4px solid #fff; box-shadow: var(--shadow); }
  .avatar-ph { background: #e2e8f0; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #94a3b8; }

  /* Navigation Tabs */
  .nav-tabs { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
  .nav-tabs::-webkit-scrollbar { display: none; }
  .nav-tabs button { background: none; color: var(--text-muted); border-radius: 0; border-bottom: 3px solid transparent; padding: 12px 20px; white-space: nowrap; }
  .nav-tabs button.active { color: var(--primary); border-bottom-color: var(--primary); }

  /* Tables */
  .table-responsive { width: 100%; overflow-x: auto; border-radius: var(--radius-md); border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th { background: #f8fafc; text-align: left; padding: 15px; font-size: 12px; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); }
  td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 14px; }

  /* Responsive Mobile */
  @media (max-width: 900px) {
    .dashboard-grid { grid-template-columns: 1fr; }
    .profile-header { flex-direction: column; text-align: center; }
    header.app-header { flex-direction: column; gap: 15px; text-align: center; }
    .auth-card { margin: 20px; padding: 20px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="app-header">
    <div class="brand">
      <img src="acshslogo.jpg" alt="Logo" width="45" height="45">
      <div><div class="title">myACSHS</div><div style="font-size:12px; color:var(--text-muted)">Student Management System</div></div>
    </div>
    <button class="btn-danger" id="logoutBtn" style="display:none" onclick="logout()"><i class="fa-solid fa-power-off"></i> Sign Out</button>
  </header>

  <div id="authContainer">
    <div id="loginSection" class="auth-card">
      <h2>Welcome Back</h2>
      <p style="color:var(--text-muted); margin-bottom:25px">Please login to your account</p>
      
      <div class="input-group">
        <label>Portal Role</label>
        <select id="loginRole"><option value="student">Student</option><option value="admin">Administrator</option></select>
      </div>
      <div class="input-group">
        <label>ID / Username</label>
        <input type="text" id="loginId" placeholder="Enter your ID">
      </div>
      <div class="input-group">
        <label>Password</label>
        <div class="pass-wrapper">
          <input type="password" id="loginPass" placeholder="••••••••">
          <i class="fa-solid fa-eye-slash toggle-eye" onclick="viewPass('loginPass', this)"></i>
        </div>
      </div>
      <button class="btn-primary" onclick="handleLogin()">Sign In</button>
      <div style="text-align:center; margin-top:20px; font-size:14px">
        New Student? <a href="javascript:void(0)" onclick="toggleAuth(true)" style="color:var(--primary); font-weight:700">Create Account</a>
      </div>
    </div>

    <div id="signupSection" class="auth-card" style="display:none">
      <h2>Create Account</h2>
      <div class="input-group"><label>First Name</label><input type="text" id="regF"></div>
      <div class="input-group"><label>Last Name</label><input type="text" id="regL"></div>
      <div class="input-group"><label>Student ID</label><input type="text" id="regId" placeholder="12-3456-789"></div>
      <div class="input-group"><label>Birth Date</label><input type="date" id="regB"></div>
      <div class="input-group"><label>Strand/Track</label><input type="text" id="regT" placeholder="e.g. ICT"></div>
      <div class="input-group">
        <label>Password</label>
        <div class="pass-wrapper">
          <input type="password" id="regPass" placeholder="••••••••">
          <i class="fa-solid fa-eye-slash toggle-eye" onclick="viewPass('regPass', this)"></i>
        </div>
      </div>
      <button class="btn-primary" onclick="handleSignup()">Register</button>
      <div style="text-align:center; margin-top:20px; font-size:14px">
        Already registered? <a href="javascript:void(0)" onclick="toggleAuth(false)" style="color:var(--primary); font-weight:700">Login</a>
      </div>
    </div>
  </div>

  <main id="dashboardContainer" style="display:none">
    <div class="dashboard-grid">
      <div class="main-content">
        <div class="content-card">
          <div class="profile-header">
            <div id="userAvatarArea" class="avatar-container"></div>
            <div>
              <h1 id="dispName" style="margin:0; font-size:26px">...</h1>
              <p id="dispSub" style="margin:5px 0 0 0; color:var(--text-muted); font-weight:500"></p>
            </div>
          </div>
          <nav id="dashboardTabs" class="nav-tabs"></nav>
          <div id="dashboardViewArea"></div>
        </div>
      </div>
      
      <aside>
        <div class="content-card" style="padding:20px">
          <h4 style="margin:0 0 15px 0">School Information</h4>
          <div style="font-size:14px; margin-bottom:10px"><b>Date:</b> <span id="curDate"></span></div>
          <div style="font-size:14px; color:var(--primary); font-weight:700" id="statBox"></div>
          <hr style="border:0; border-top:1px solid var(--border); margin:20px 0">
          <p style="font-size:12px; color:var(--text-muted)">© 2024 Ants Christian School of High Science. All rights reserved.</p>
        </div>
      </aside>
    </div>
  </main>
</div>

<script>
/* DATA PERSISTENCE LAYER */
const DB = {
  get: (key) => JSON.parse(localStorage.getItem('acshs_'+key) || '[]'),
  set: (key, val) => localStorage.setItem('acshs_'+key, JSON.stringify(val)),
  session: {
    get: () => JSON.parse(localStorage.getItem('acshs_session')),
    set: (data) => localStorage.setItem('acshs_session', JSON.stringify(data)),
    clear: () => localStorage.removeItem('acshs_session')
  }
};

const ADMIN_CREDS = { user: 'admin', pass: 'admin123' };
let currentUser = null;

/* INITIALIZATION */
window.onload = () => {
  const session = DB.session.get();
  if(session) { currentUser = session; showDashboard(); }
  document.getElementById('curDate').innerText = new Date().toLocaleDateString('en-PH', { weekday:'long', month:'long', day:'numeric' });
};

/* AUTHENTICATION LOGIC */
function viewPass(id, el) {
  const input = document.getElementById(id);
  const isPass = input.type === 'password';
  input.type = isPass ? 'text' : 'password';
  el.className = isPass ? 'fa-solid fa-eye toggle-eye' : 'fa-solid fa-eye-slash toggle-eye';
}

function toggleAuth(isSignup) {
  document.getElementById('loginSection').style.display = isSignup ? 'none' : 'block';
  document.getElementById('signupSection').style.display = isSignup ? 'block' : 'none';
}

function handleSignup() {
  const user = { 
    id: regId.value, f: regF.value, l: regL.value, b: regB.value, t: regT.value, p: regPass.value, img: null 
  };
  if(!user.id || !user.p) return alert("Fill required fields!");
  let students = DB.get('students');
  students.push(user);
  DB.set('students', students);
  alert("Success! Now please login.");
  toggleAuth(false);
}

function handleLogin() {
  const r = loginRole.value, id = loginId.value, p = loginPass.value;
  if(r === 'admin' && id === ADMIN_CREDS.user && p === ADMIN_CREDS.pass) {
    currentUser = { role: 'admin', name: 'System Administrator', id: 'ADMIN' };
  } else {
    const s = DB.get('students').find(x => x.id === id && x.p === p);
    if(!s) return alert("Invalid Credentials");
    currentUser = { role: 'student', ...s, name: s.f + ' ' + s.l };
  }
  DB.session.set(currentUser);
  showDashboard();
}

function logout() { DB.session.clear(); location.reload(); }

/* DASHBOARD CONTROLLER */
function showDashboard() {
  document.getElementById('authContainer').style.display = 'none';
  document.getElementById('dashboardContainer').style.display = 'block';
  document.getElementById('logoutBtn').style.display = 'inline-flex';
  
  document.getElementById('dispName').innerText = currentUser.name;
  document.getElementById('dispSub').innerText = currentUser.role === 'admin' ? 'Administrative Access' : `ID: ${currentUser.id} | ${currentUser.t}`;
  document.getElementById('userAvatarArea').innerHTML = currentUser.img 
    ? `<img src="${currentUser.img}">` 
    : `<div class="avatar-ph"><i class="fa-solid fa-user"></i></div>`;

  setupTabs();
  updateStats();
}

function setupTabs() {
  const tabs = document.getElementById('dashboardTabs');
  tabs.innerHTML = '';
  if(currentUser.role === 'admin') {
    createTab('Students', renderAdminStudents, true);
    createTab('Attendance', renderAdminAttendance);
    createTab('Grades', renderAdminGrades);
    createTab('Schedule', renderAdminSchedule);
  } else {
    createTab('My Schedule', renderStudentSchedule, true);
    createTab('Attendance', renderStudentAttendance);
    createTab('My Grades', renderStudentGrades);
  }
}

function createTab(text, fn, active = false) {
  const b = document.createElement('button');
  b.innerText = text;
  if(active) { b.classList.add('active'); fn(); }
  b.onclick = (e) => {
    document.querySelectorAll('.nav-tabs button').forEach(x => x.classList.remove('active'));
    e.target.classList.add('active');
    fn();
  };
  document.getElementById('dashboardTabs').appendChild(b);
}

/* VIEW RENDERING FUNCTIONS */
function renderAdminStudents() {
  const data = DB.get('students');
  let rows = data.map((s, i) => `
    <tr>
      <td>${s.img ? `<img src="${s.img}" style="width:30px;height:30px;border-radius:5px;vertical-align:middle;margin-right:10px">` : ''}${s.id}</td>
      <td>${s.f} ${s.l}</td>
      <td>
        <button class="btn-ghost" style="padding:5px 10px" onclick="triggerUpload(${i})"><i class="fa-solid fa-camera"></i></button>
        <button class="btn-danger" style="padding:5px 10px" onclick="delStudent(${i})"><i class="fa-solid fa-trash"></i></button>
      </td>
    </tr>
  `).join('');
  
  document.getElementById('dashboardViewArea').innerHTML = `
    <h3>Registered Students</h3>
    <div class="table-responsive">
      <table><thead><tr><th>Student ID</th><th>Full Name</th><th>Actions</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="3">No students enrolled</td></tr>'}</tbody></table>
    </div>`;
}

function renderAdminSchedule() {
  document.getElementById('dashboardViewArea').innerHTML = `
    <h3>Class Schedule Manager</h3>
    <div style="display:grid; gap:10px; margin-bottom:20px">
      <input id="sSub" placeholder="Subject Name">
      <input id="sTime" placeholder="Time (e.g. 7:30 AM - 9:00 AM)">
      <button class="btn-primary" onclick="addSched()">Add to Schedule</button>
    </div>
    <div id="schedList"></div>`;
  refreshSchedList();
}

function renderStudentSchedule() {
  const list = DB.get('schedule');
  let rows = list.map(x => `<tr><td><b>${x.sub}</b></td><td>${x.time}</td></tr>`).join('');
  document.getElementById('dashboardViewArea').innerHTML = `
    <h3>Class Schedule</h3>
    <div class="table-responsive">
      <table><thead><tr><th>Subject</th><th>Time</th></tr></thead><tbody>${rows || '<td>No classes</td>'}</tbody></table>
    </div>`;
}

function renderStudentGrades() {
  const grades = DB.get('grades').filter(x => x.sid === currentUser.id);
  let rows = grades.map(x => `<tr><td>${x.sub}</td><td style="font-weight:700; color:var(--primary)">${x.val}</td></tr>`).join('');
  document.getElementById('dashboardViewArea').innerHTML = `<h3>Academic Performance</h3>
    <div class="table-responsive"><table><thead><tr><th>Subject</th><th>Grade</th></tr></thead><tbody>${rows || '<td>No grades yet</td>'}</tbody></table></div>`;
}

/* DATA ACTIONS */
function addSched() {
  const list = DB.get('schedule');
  list.push({ sub: sSub.value, time: sTime.value });
  DB.set('schedule', list);
  refreshSchedList();
}

function refreshSchedList() {
  const list = DB.get('schedule');
  document.getElementById('schedList').innerHTML = list.map((x,i) => `
    <div style="padding:10px; border:1px solid var(--border); margin-bottom:5px; border-radius:8px; display:flex; justify-content:space-between">
      <span>${x.sub} (${x.time})</span>
      <i class="fa-solid fa-times" style="color:red; cursor:pointer" onclick="delSched(${i})"></i>
    </div>`).join('');
}

function delSched(i) {
  let list = DB.get('schedule');
  list.splice(i, 1);
  DB.set('schedule', list);
  refreshSchedList();
}

function triggerUpload(index) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = e => {
    const reader = new FileReader();
    reader.onload = event => {
      let students = DB.get('students');
      students[index].img = event.target.result;
      DB.set('students', students);
      if(currentUser.id === students[index].id) {
        currentUser.img = event.target.result;
        DB.session.set(currentUser);
      }
      showDashboard();
    };
    reader.readAsDataURL(e.target.files[0]);
  };
  input.click();
}

function delStudent(i) {
  if(!confirm("Are you sure?")) return;
  let s = DB.get('students');
  s.splice(i,1);
  DB.set('students', s);
  renderAdminStudents();
  updateStats();
}

function updateStats() {
  const count = DB.get('students').length;
  document.getElementById('statBox').innerText = `Active Students: ${count}`;
}

// These functions handle simple stubs for grades and attendance for the admin
function renderAdminAttendance() { document.getElementById('dashboardViewArea').innerHTML = "<h3>Daily Attendance</h3><p>Select a date to view logs.</p>"; }
function renderAdminGrades() { document.getElementById('dashboardViewArea').innerHTML = "<h3>Grade Encoder</h3><p>Search for a student to encode grades.</p>"; }
function renderStudentAttendance() { document.getElementById('dashboardViewArea').innerHTML = "<h3>My Attendance</h3><p>Your records are up to date.</p>"; }

</script>
</body>
</html>
