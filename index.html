<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>myACSHS | Enterprise Portal v7.0</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        /* --- PROFESSIONAL ENHANCED STYLING --- */
        :root {
            --bg-1: #f8fafc;
            --bg-2: #ffffff;
            --primary: #1e40af;
            --primary-light: #3b82f6;
            --accent: #7c3aed;
            --accent-light: #a855f7;
            --muted: #64748b;
            --muted-light: #94a3b8;
            --card: #ffffff;
            --card-hover: #f1f5f9;
            --danger: #dc2626;
            --danger-light: #ef4444;
            --success: #059669;
            --success-light: #10b981;
            --warning: #d97706;
            --radius: 16px;
            --radius-sm: 8px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { 
            box-sizing: border-box; 
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-1) 0%, #e2e8f0 100%);
            color: #1e293b;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            line-height: 1.6;
        }

        .app {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* --- AUTHENTICATION STYLES --- */
        .auth-overlay {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(20px);
            z-index: 9999; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            padding: 20px;
        }

        .auth-box {
            background: var(--card); 
            width: 100%; 
            max-width: 450px;
            padding: 48px; 
            border-radius: var(--radius); 
            box-shadow: var(--shadow-xl);
            border: 1px solid rgba(148, 163, 184, 0.1);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(30px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .auth-logo { 
            width: 80px; 
            height: 80px; 
            margin: 0 auto 24px; 
            display: block; 
            border-radius: var(--radius-sm); 
            box-shadow: var(--shadow);
        }

        .auth-box h2 {
            text-align: center;
            margin-bottom: 8px;
            font-weight: 800;
            font-size: 28px;
            color: var(--primary);
        }

        .auth-box p {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 32px;
        }

        /* --- HEADER --- */
        .app-header {
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(20px);
            padding: 20px 32px; 
            border-radius: var(--radius); 
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: var(--shadow-lg);
            transition: var(--transition);
        }

        .app-header:hover {
            box-shadow: var(--shadow-xl);
        }

        .header-brand { 
            display: flex; 
            align-items: center; 
            gap: 16px; 
        }
        
        .header-brand img {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
        }
        
        .header-brand h1 { 
            font-size: 24px; 
            margin: 0; 
            font-weight: 900; 
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-user {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-user b {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
        }

        /* --- MAIN GRID (The 2-Column Layout) --- */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 360px; /* Sidebar on the RIGHT as provided */
            gap: 24px;
        }

        @media (max-width: 1024px) {
            .main-grid { grid-template-columns: 1fr; }
            .sidebar { order: -1; } /* Profile moves to top on mobile */
        }

        /* --- SIDEBAR COMPONENTS --- */
        .sidebar { 
            display: flex; 
            flex-direction: column; 
            gap: 24px; 
        }
        
        .card {
            background: var(--card); 
            border-radius: var(--radius); 
            padding: 32px;
            box-shadow: var(--shadow); 
            border: 1px solid rgba(148, 163, 184, 0.1);
            transition: var(--transition);
        }

        .card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        /* The SQUARE avatar from your file */
        .avatar-square {
            width: 140px; 
            height: 140px; 
            background: linear-gradient(135deg, #f1f5f9, #e2e8f0); 
            border-radius: var(--radius);
            margin: 0 auto 24px; 
            overflow: hidden; 
            border: 4px solid #ffffff;
            display: flex; 
            align-items: center; 
            justify-content: center;
            box-shadow: var(--shadow-lg);
            transition: var(--transition);
        }
        
        .avatar-square:hover {
            transform: scale(1.05);
        }
        
        .avatar-square img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        
        .avatar-square i { 
            font-size: 60px; 
            color: var(--primary); 
        }

        .profile-name { 
            font-size: 22px; 
            font-weight: 800; 
            text-align: center; 
            margin: 0; 
            color: var(--primary);
        }
        
        .profile-id { 
            font-family: 'JetBrains Mono'; 
            font-size: 13px; 
            color: var(--accent); 
            text-align: center; 
            display: block; 
            margin-top: 8px; 
            font-weight: 600; 
            letter-spacing: 0.5px;
        }

        .stat-row { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 16px; 
            margin-top: 24px; 
        }
        
        .stat-item { 
            background: linear-gradient(135deg, #f8fafc, #f1f5f9); 
            padding: 16px; 
            border-radius: var(--radius-sm); 
            text-align: center; 
            border: 1px solid rgba(148, 163, 184, 0.1);
            transition: var(--transition);
        }
        
        .stat-item:hover {
            background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
        }
        
        .stat-item label { 
            font-size: 11px; 
            font-weight: 800; 
            color: var(--muted); 
            text-transform: uppercase; 
            display: block; 
            letter-spacing: 0.5px;
        }
        
        .stat-item span { 
            font-size: 20px; 
            font-weight: 900; 
            color: var(--primary); 
        }

        .status-section {
            margin-top: 32px; 
            border-top: 1px solid #e2e8f0; 
            padding-top: 24px;
        }

        .status-section label {
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            display: block;
            margin-bottom: 8px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        .status-text {
            font-size: 14px;
            font-weight: 700;
            color: var(--success);
        }

        /* --- TABS & CONTENT --- */
        .tab-nav { 
            display: flex; 
            gap: 12px; 
            margin-bottom: 24px; 
            overflow-x: auto; 
            padding-bottom: 8px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        .tab-nav::-webkit-scrollbar {
            display: none;
        }
        
        .tab-btn {
            padding: 14px 24px; 
            border-radius: var(--radius-sm); 
            border: 2px solid transparent;
            background: #f1f5f9;
            color: var(--primary); 
            font-weight: 700; 
            font-size: 14px; 
            cursor: pointer;
            white-space: nowrap; 
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        
        .tab-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .tab-btn:hover::before {
            left: 100%;
        }
        
        .tab-btn.active { 
            background: linear-gradient(135deg, var(--primary), var(--primary-light)); 
            color: #ffffff; 
            box-shadow: 0 4px 15px rgba(30, 64, 175, 0.3);
            border-color: var(--primary);
        }

        /* --- SCHEDULE DESIGN --- */
        .schedule-table { 
            width: 100%; 
            border-collapse: collapse; 
            border-radius: var(--radius-sm);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        
        .schedule-table th { 
            text-align: left; 
            font-size: 12px; 
            text-transform: uppercase; 
            color: var(--muted); 
            padding: 16px; 
            border-bottom: 2px solid #e2e8f0;
            background: #f8fafc;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        
        .schedule-table td { 
            padding: 16px; 
            border-bottom: 1px solid #f1f5f9; 
            font-size: 14px;
            transition: background-color 0.2s;
        }
        
        .schedule-table tr:hover td {
            background-color: #f8fafc;
        }
        
        .day-badge { 
            background: linear-gradient(135deg, #eef2ff, #e0e7ff); 
            color: var(--primary); 
            padding: 6px 12px; 
            border-radius: var(--radius-sm); 
            font-weight: 800; 
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- INPUTS & BUTTONS --- */
        .form-group { 
            margin-bottom: 20px; 
        }
        
        label { 
            font-size: 13px; 
            font-weight: 700; 
            color: var(--muted); 
            display: block; 
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }
        
        input, select {
            width: 100%; 
            height: 52px; 
            padding: 0 16px; 
            border-radius: var(--radius-sm);
            border: 2px solid #e2e8f0; 
            background: #ffffff; 
            font-size: 16px; 
            transition: var(--transition);
            font-family: inherit;
        }
        
        input:focus, select:focus { 
            border-color: var(--primary); 
            outline: none; 
            background: #ffffff; 
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }
        
        .btn-main {
            width: 100%; 
            height: 52px; 
            background: linear-gradient(135deg, var(--primary), var(--primary-light)); 
            color: #ffffff; 
            border: none;
            border-radius: var(--radius-sm); 
            font-weight: 800; 
            cursor: pointer; 
            transition: var(--transition);
            font-size: 16px;
            position: relative;
            overflow: hidden;
        }
        
        .btn-main::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .btn-main:hover::before {
            left: 100%;
        }
        
        .btn-main:hover { 
            background: linear-gradient(135deg, var(--accent), var(--accent-light)); 
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: var(--primary);
            border: 2px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
            border-color: var(--primary);
        }

        .toast {
            position: fixed; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%);
            background: linear-gradient(135deg, #1e293b, #334155); 
            color: #ffffff; 
            padding: 16px 32px; 
            border-radius: 50px;
            font-weight: 600; 
            font-size: 14px; 
            opacity: 0; 
            transition: var(--transition); 
            z-index: 10000;
            box-shadow: var(--shadow-xl);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .toast.show { 
            opacity: 1; 
            bottom: 50px; 
        }

        /* --- ADDITIONAL PROFESSIONAL TOUCHES --- */
        .card h3, .card h4 {
            margin: 0 0 16px 0;
            font-weight: 800;
            color: var(--primary);
            font-size: 20px;
        }

        .card hr {
            border: 0;
            border-top: 1px solid #e2e8f0;
            margin: 24px 0;
        }

        .mini-schedule-item {
            font-size: 13px;
            margin-bottom: 12px;
            padding: 8px;
            background: #f8fafc;
            border-radius: var(--radius-sm);
            border-left: 4px solid var(--primary);
        }

                .mini-schedule-item b {
            color: var(--primary);
        }

        .mini-schedule-item span {
            color: var(--muted);
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .app-header {
                padding: 16px 20px;
                flex-direction: column;
                gap: 16px;
            }

            .header-brand h1 {
                font-size: 20px;
            }

            .auth-box {
                padding: 32px 24px;
                max-width: 100%;
            }

            .card {
                padding: 24px;
            }

            .avatar-square {
                width: 120px;
                height: 120px;
            }

            .stat-row {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .tab-nav {
                flex-wrap: wrap;
            }

            .tab-btn {
                padding: 12px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

<div id="vAuth" class="auth-overlay">
    <div class="auth-box" id="loginBox">
        <img src="acshslogo.jpg" class="auth-logo" alt="ACSHS Logo">
        <h2>Portal Login</h2>
        <p>Antipolo City Senior High School</p>
        
        <div class="form-group">
            <label>Role</label>
            <select id="lRole">
                <option value="student">Student</option>
                <option value="admin">Administrator</option>
            </select>
        </div>
        <div class="form-group">
            <label>Student ID</label>
            <input type="text" id="lId" placeholder="2024-XXXX-XXX">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="lPass" placeholder="••••••••">
        </div>
        <button class="btn-main" onclick="sys.login()">LOGIN</button>
        <div style="margin-top:20px; text-align:center; font-size:13px">
            <span style="color:var(--primary); cursor:pointer; font-weight:700" onclick="ui.swapAuth('forgotBox')">Forgot Password?</span>
            <span style="margin:0 10px; color:#cbd5e1">|</span>
            <span style="color:var(--primary); cursor:pointer; font-weight:700" onclick="ui.swapAuth('regBox')">Register</span>
        </div>
    </div>

    <div class="auth-box" id="regBox" style="display:none">
        <h2>New Student</h2>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="rName" placeholder="Enter your full name">
        </div>
        <div class="form-group">
            <label>Student ID</label>
            <input type="text" id="rId" placeholder="2024-XXXX-XXX">
        </div>
        <div class="form-group">
            <label>Slip Code (112233)</label>
            <input type="text" id="rSlip" placeholder="Enter slip code">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="rPass" placeholder="Create a password">
        </div>
        <button class="btn-main" onclick="sys.register()">CREATE ACCOUNT</button>
        <p style="text-align:center; margin-top:15px; cursor:pointer; font-size:13px" onclick="ui.swapAuth('loginBox')">Cancel</p>
    </div>

    <div class="auth-box" id="forgotBox" style="display:none">
        <h2>Recover Account</h2>
        <div class="form-group">
            <label>Student ID</label>
            <input type="text" id="fId" placeholder="2024-XXXX-XXX">
        </div>
        <div class="form-group">
            <label>Registry Slip Code</label>
            <input type="text" id="fSlip" placeholder="Enter slip code">
        </div>
        <div class="form-group">
            <label>New Password</label>
            <input type="password" id="fPass" placeholder="New password">
        </div>
        <button class="btn-main" onclick="sys.reset()">RESET PASSWORD</button>
        <p style="text-align:center; margin-top:15px; cursor:pointer; font-size:13px" onclick="ui.swapAuth('loginBox')">Back to Login</p>
    </div>
</div>

<div class="app" id="vApp" style="display:none">
    <header class="app-header">
        <div class="header-brand">
            <img src="acshslogo.jpg" alt="ACSHS Logo">
            <h1>myACSHS <span>Portal</span></h1>
        </div>
        <div class="header-user">
            <b id="topUser">User Name</b>
            <button class="btn-main" style="width:90px; height:35px; background:var(--danger); font-size:12px" onclick="sys.logout()">LOGOUT</button>
        </div>
    </header>

    <div class="main-grid">
        <div class="main-content">
            <div class="tab-nav" id="tabArea"></div>
            <div id="viewArea"></div>
        </div>

        <aside class="sidebar">
            <div class="card">
                <div class="avatar-square" id="sideAvatar"></div>
                <h3 class="profile-name" id="sideName">Dela Cruz, Juan</h3>
                <span class="profile-id" id="sideId">2024-1234-567</span>
                
                <div class="stat-row">
                    <div class="stat-item">
                        <label>Gen Ave</label>
                        <span id="statAve">92.4</span>
                    </div>
                    <div class="stat-item">
                        <label>Absences</label>
                        <span id="statAbs">0</span>
                    </div>
                </div>

                <div class="status-section">
                    <label>Current Status</label>
                    <div class="status-indicator">
                        <div class="status-dot"></div>
                        <span class="status-text">Enrolled (Regular)</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <h4>Today's Subjects</h4>
                <div id="todayMiniSched"></div>
            </div>
        </aside>
    </div>
</div>

<div id="toast" class="toast">Action Successful</div>

<script>
    /* --- ENTERPRISE CORE ENGINE --- 
    */
    const CONFIG = {
        SLIPS: ["112233"],

        // FULL SCHEDULE MON-FRI

                { time: "09:35-10:35", sub: "Student Review", prof: "Staff" }
            ]
        }
    };

    const INITIAL_USERS = [
        { id: "2024-0001", name: "Dela Cruz, Juan", pass: "123", grades: {"Media & Info Literacy":92, "JAVA (Enterprise)":94, "Inquiries & Immersion":89, "Work Immersion":91, "PE & Health":90}, pic: null, abs: 0 }
    ];

    const db = {
        k: 'ACSHS_V7_PRO',
        save: (d) => localStorage.setItem(db.k, JSON.stringify(d)),
        load: () => JSON.parse(localStorage.getItem(db.k) || JSON.stringify(INITIAL_USERS)),

    const sys = {
        user: null, tab: 'Dashboard',
        init() {
            const s = db.sessGet();
            if(s) { this.user = s; this.launch(); }
        },
        login() {
            const r = lRole.value, id = lId.value.trim(), p = lPass.value;
            if(r === 'admin' && id === 'admin' && p === 'admin123') {
                this.user = { role:'admin', name:'Registrar Admin', id:'FAC-001' };
            } else {
                const u = db.load().find(x => x.id === id && x.pass === p);
                if(!u) return ui.notify("Invalid Account Credentials", true);
                this.user = { role:'student', ...u };

            if(!CONFIG.SLIPS.includes(rSlip.value)) return ui.notify("Invalid Slip Code", true);
            let u = db.load();
            if(u.some(x => x.id === rId.value)) return ui.notify("ID Already Exists", true);
            u.push({ id: rId.value, name: rName.value, pass: rPass.value, grades: CONFIG.SUBJECTS.reduce((a,s)=>({...a,[s]:0}),{}), pic:null, abs:0 });
            db.save(u); ui.notify("Account Created!"); ui.swapAuth('loginBox');

            if(!CONFIG.SLIPS.includes(fSlip.value)) return ui.notify("Verification Failed", true);
            let u = db.load();
            const i = u.findIndex(x => x.id === fId.value);
            if(i === -1) return ui.notify("ID Not Found", true);
            u[i].pass = fPass.value; db.save(u); ui.notify("Password Reset Success!"); ui.swapAuth('loginBox');
        },
