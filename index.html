<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>myACSHS — Official Student Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
  :root {
    --bg-main: #f8fafc;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --danger: #ef4444;
    --radius-lg: 16px;
    --radius-md: 12px;
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
  }

  * { box-sizing: border-box; transition: all 0.2s ease; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: var(--text-main); padding: 15px; }
  
  .app { width: 100%; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }

  header.app-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .brand { display: flex; gap: 10px; align-items: center; }
  .title { font-weight: 800; font-size: 20px; color: var(--primary); letter-spacing: -0.5px; }
  
  .card { background: var(--card-bg); border-radius: var(--radius-lg); padding: 25px; border: 1px solid var(--border); box-shadow: var(--shadow); width: 100%; }
  
  /* Password Wrapper for Eye Icon */
  .pass-wrapper { position: relative; width: 100%; margin-bottom: 12px; }
  .pass-wrapper input { margin-bottom: 0; padding-right: 45px; }
  .toggle-eye {
    position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); cursor: pointer; font-size: 16px;
  }
  .toggle-eye:hover { color: var(--primary); }

  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
  input, select { width: 100%; padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--border); font-size: 14px; margin-bottom: 12px; background: #fdfdfd; }
  
  button { padding: 12px 18px; border-radius: var(--radius-md); border: none; font-weight: 600; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; min-height: 44px; }
  button.primary { background: var(--primary); color: white; width: 100%; }
  button.danger { background: #fee2e2; color: var(--danger); padding: 8px 12px; }

  .toggle-link { text-align: center; margin-top: 15px; font-size: 14px; color: var(--text-muted); }
  .toggle-link span { color: var(--primary); font-weight: 700; cursor: pointer; }

  /* Responsive Grid */
  .grid-layout { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; }
  @media (max-width: 900px) {
    .grid-layout { grid-template-columns: 1fr; }
    header.app-header { flex-direction: column; gap: 10px; }
  }

  .tabs { display: flex; gap: 5px; margin-bottom: 20px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { background: none; color: var(--text-muted); border-radius: 0; border-bottom: 3px solid transparent; padding: 12px 15px; flex-shrink: 0; }
  .tabs button.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 700; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; color: var(--text-muted); padding: 10px; border-bottom: 1px solid var(--border); text-transform: uppercase; }
  td { padding: 12px 10px; border-bottom: 1px solid var(--border); font-size: 14px; }
  
  .profile-header { display: flex; gap: 20px; align-items: center; margin-bottom: 24px; }
  .avatar-box img, .avatar-placeholder { width: 100px; height: 100px; border-radius: 20px; object-fit: cover; border: 3px solid white; box-shadow: var(--shadow); }
  .avatar-placeholder { background: #e2e8f0; display: flex; align-items: center; justify-content: center; font-size: 32px; }
</style>
</head>
<body>

<div class="app">
  <header class="app-header">
    <div class="brand">
      <img src="acshslogo.jpg" alt="Logo" width="40" height="40" style="border-radius:8px;">
      <div><div class="title">myACSHS</div><div class="subtitle" style="font-size:11px; color:var(--text-muted)">Student Records Portal</div></div>
    </div>
    <button class="danger" id="logoutBtn" style="display:none; width: auto;" onclick="logout()">Sign Out</button>
  </header>

  <main id="authView" class="card" style="max-width:400px; margin: 40px auto;">
    <div id="loginForm">
        <h2 style="margin:0">Sign In</h2>
        <p style="font-size:13px; color:var(--text-muted); margin-bottom:20px">Welcome back! Please enter your details.</p>
        <label>Role</label>
        <select id="loginRole"><option value="student">Student</option><option value="admin">Administrator</option></select>
        <label>ID / Username</label>
        <input id="loginId" type="text" placeholder="ID Number">
        
        <label>Password</label>
        <div class="pass-wrapper">
            <input id="loginPass" type="password" placeholder="••••••••">
            <i class="fa-solid fa-eye-slash toggle-eye" onclick="togglePass('loginPass', this)"></i>
        </div>
        
        <button class="primary" onclick="login()">Log In</button>
        <div class="toggle-link">Don't have an account? <span onclick="toggleAuth(true)">Create Account</span></div>
    </div>

    <div id="signUpForm" style="display:none">
        <h2 style="margin:0">Create Account</h2>
        <p style="font-size:13px; color:var(--text-muted); margin-bottom:20px">Join the ACSHS community.</p>
        <label>First Name</label><input id="regF" placeholder="First Name">
        <label>Last Name</label><input id="regL" placeholder="Last Name">
        <label>Student ID Number</label><input id="regId" placeholder="e.g. 12-3456-789">
        <label>Birth Date</label><input id="regB" type="date">
        <label>Course Track</label><input id="regT" placeholder="e.g. ICT, STEM, HUMSS">
        
        <label>Create Password</label>
        <div class="pass-wrapper">
            <input id="regPass" type="password" placeholder="••••••••">
            <i class="fa-solid fa-eye-slash toggle-eye" onclick="togglePass('regPass', this)"></i>
        </div>
        
        <button class="primary" onclick="signUp()">Register Now</button>
        <div class="toggle-link">Already have an account? <span onclick="toggleAuth(false)">Sign In</span></div>
    </div>
  </main>

  <section id="dashboardView" style="display:none">
    <div class="grid-layout">
      <div class="main-column">
        <div class="card">
          <div class="profile-header">
            <div id="userPhoto" class="avatar-box"></div>
            <div>
              <h2 id="userNameDisplay" style="margin:0; font-size:22px">User</h2>
              <p id="userSubDisplay" style="color:var(--text-muted); margin:4px 0 0 0; font-size:14px"></p>
            </div>
          </div>
          <div id="tabsArea" class="tabs"></div>
          <div id="mainArea"></div>
        </div>
      </div>
      <aside class="card">
        <label>Portal Date</label>
        <div id="todayDate" style="font-weight:700; font-size:15px; margin-bottom:10px"></div>
        <div id="quickStats" style="font-size:13px; color:var(--primary); font-weight:600"></div>
      </aside>
    </div>
  </section>
</div>

<script>
const LS = { USERS: 'csr_users_v1', ATT: 'csr_attendance_v1', GRADES: 'csr_grades_v1', SCHED: 'csr_schedule_v1', SESSION: 'csr_active_session' };
const ADMIN = { user:'admin', pass:'admin123' };

function read(k){ try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch(e) { return []; } }
function write(k,v){ localStorage.setItem(k, JSON.stringify(v)); }

let state = { role:null, user:null };

// Password Toggle Function
function togglePass(id, icon) {
    const input = document.getElementById(id);
    if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye-slash", "fa-eye");
    } else {
        input.type = "password";
        icon.classList.replace("fa-eye", "fa-eye-slash");
    }
}

window.onload = function() {
  const savedSession = localStorage.getItem(LS.SESSION);
  if (savedSession) {
    state = JSON.parse(savedSession);
    openDashboard();
  }
  document.getElementById('todayDate').innerText = new Date().toLocaleDateString(undefined, { month:'long', day:'numeric', year:'numeric' });
};

function toggleAuth(showSignUp) {
    document.getElementById('loginForm').style.display = showSignUp ? 'none' : 'block';
    document.getElementById('signUpForm').style.display = showSignUp ? 'block' : 'none';
}

function signUp() {
    const f = regF.value.trim(), l = regL.value.trim(), id = regId.value.trim(), b = regB.value, t = regT.value.trim(), p = regPass.value;
    if(!f || !l || !id || !p) return alert("All fields required.");
    let users = read(LS.USERS);
    if(users.find(u => u.id === id)) return alert("ID already registered.");
    users.push({ id, firstName: f, lastName: l, birth: b, track: t, password: p, avatar: null });
    write(LS.USERS, users);
    alert("Registered! Please sign in."); toggleAuth(false);
}

function login(){
  const role = loginRole.value, id = loginId.value.trim(), pass = loginPass.value.trim();
  if(role==='admin' && id===ADMIN.user && pass===ADMIN.pass){
    state = { role:'admin', user:{firstName:'System', lastName:'Admin'} };
    saveSessionAndOpen();
  } else {
    const u = read(LS.USERS).find(x => x.id === id);
    if(u && pass === u.password){
      state = { role:'student', user:u }; 
      saveSessionAndOpen();
    } else { alert('Invalid Login Details'); }
  }
}

function saveSessionAndOpen() { localStorage.setItem(LS.SESSION, JSON.stringify(state)); openDashboard(); }
function logout(){ localStorage.removeItem(LS.SESSION); location.reload(); }

function openDashboard(){
  document.getElementById('authView').style.display='none';
  document.getElementById('dashboardView').style.display='block';
  document.getElementById('logoutBtn').style.display='inline-flex';
  const u = state.user;
  document.getElementById('userNameDisplay').innerText = `${u.firstName} ${u.lastName}`;
  document.getElementById('userSubDisplay').innerText = state.role==='admin' ? 'Admin' : `${u.id} | ${u.track}`;
  document.getElementById('userPhoto').innerHTML = u.avatar ? `<img src="${u.avatar}">` : `<div class="avatar-placeholder">👤</div>`;
  renderTabs(); updateStats();
}

function renderTabs(){
  const area = document.getElementById('tabsArea'); area.innerHTML = '';
  if(state.role==='admin'){
    addTab('Directory', true, renderAdminStudents);
    addTab('Attendance', false, renderAdminAttendance);
    addTab('Grades', false, renderAdminGrades);
  } else {
    addTab('Schedule', true, renderStudentSchedule);
    addTab('Attendance', false, renderStudentAttendance);
    addTab('Grades', false, renderStudentGrades);
  }
}

function addTab(label, active, fn){
  const btn = document.createElement('button'); btn.innerText = label;
  if(active){ btn.className='active'; fn(); }
  btn.onclick = (e) => { 
    Array.from(area.children).forEach(c=>c.classList.remove('active'));
    e.target.classList.add('active'); fn(); 
  };
  area.appendChild(btn);
}

/* PANELS */
function renderAdminStudents(){
  const users = read(LS.USERS);
  const rows = users.map((u,i)=>`<tr><td>${u.id}</td><td>${u.firstName}</td><td><button class="danger" onclick="deleteUser(${i})">🗑️</button></td></tr>`).join('');
  document.getElementById('mainArea').innerHTML = `<table><thead><tr><th>ID</th><th>Name</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function renderAdminAttendance(){
  const users = read(LS.USERS);
  document.getElementById('mainArea').innerHTML = `<h3>Record Attendance</h3>
    <select id="aId">${users.map(u=>`<option value="${u.id}">${u.firstName}</option>`)}</select>
    <button class="primary" onclick="saveAtt()">Mark Present</button>`;
}

function renderAdminGrades(){
  const users = read(LS.USERS);
  document.getElementById('mainArea').innerHTML = `<h3>Grade Entry</h3>
    <select id="gId">${users.map(u=>`<option value="${u.id}">${u.firstName}</option>`)}</select>
    <input id="gSub" placeholder="Subject"><input id="gV" type="number" placeholder="Grade">
    <button class="primary" onclick="saveGrade()">Post</button>`;
}

function renderStudentSchedule(){ document.getElementById('mainArea').innerHTML = '<h3>Your Classes</h3><p>No schedule set by admin yet.</p>'; }
function renderStudentAttendance(){ document.getElementById('mainArea').innerHTML = '<h3>Attendance History</h3><p>No records yet.</p>'; }
function renderStudentGrades(){ document.getElementById('mainArea').innerHTML = '<h3>Academic Results</h3><p>No grades posted yet.</p>'; }

function deleteUser(i){ if(confirm('Delete?')){ const list = read(LS.USERS); list.splice(i,1); write(LS.USERS,list); renderAdminStudents(); updateStats(); } }
function saveAtt(){ alert('Saved'); }
function saveGrade(){ alert('Posted'); }
function updateStats(){ document.getElementById('quickStats').innerText = `Total Students: ${read(LS.USERS).length}`; }
</script>
</body>
</html>
