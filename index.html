<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>myACSHS — Student Records System</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #f8fafc;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --accent: #4f46e5;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --danger: #ef4444;
    --success: #10b981;
    --radius-lg: 16px;
    --radius-md: 12px;
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  }

  * { box-sizing: border-box; transition: all 0.2s ease; }
  
  body {
    margin: 0; font-family: 'Inter', system-ui, sans-serif;
    background-color: var(--bg-main); color: var(--text-main);
    line-height: 1.5; padding: 24px;
  }

  .app { width: 100%; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

  /* Header Design */
  header.app-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; gap: 16px; align-items: center; }
  .brand img { border-radius: var(--radius-md); box-shadow: var(--shadow); }
  .title { font-weight: 800; font-size: 22px; letter-spacing: -0.025em; color: var(--primary); }
  .subtitle { color: var(--text-muted); font-size: 14px; font-weight: 500; }

  /* Card & Layout */
  .card { 
    background: var(--card-bg); border-radius: var(--radius-lg); padding: 24px; 
    border: 1px solid var(--border); box-shadow: var(--shadow);
  }
  .center-view { display: flex; align-items: center; justify-content: center; min-height: 70vh; }
  .grid-layout { display: grid; grid-template-columns: 1fr 340px; gap: 24px; }
  @media (max-width: 1024px) { .grid-layout { grid-template-columns: 1fr; } }

  /* Inputs & Buttons */
  label { display: block; font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 8px; }
  input, select {
    width: 100%; padding: 12px 16px; border-radius: var(--radius-md);
    border: 1px solid var(--border); background: #fdfdfd; font-size: 14px;
  }
  input:focus { outline: 2px solid var(--primary); border-color: transparent; }
  
  button {
    padding: 12px 20px; border-radius: var(--radius-md); border: none;
    font-weight: 600; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; justify-content: center;
  }
  button.primary { background: var(--primary); color: white; }
  button.primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
  button.ghost:hover { background: #f1f5f9; color: var(--text-main); }
  button.danger { background: #fee2e2; color: var(--danger); }
  button.danger:hover { background: var(--danger); color: white; }

  /* Tabs */
  .tabs { display: flex; gap: 12px; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  .tabs button { background: none; color: var(--text-muted); border-radius: 0; padding: 8px 16px; }
  .tabs button.active { color: var(--primary); border-bottom: 2px solid var(--primary); font-weight: 700; }

  /* Table */
  table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  th { text-align: left; padding: 12px; color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
  td { padding: 16px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }

  /* Profile Elements */
  .avatar-lg { 
    width: 140px; height: 140px; border-radius: var(--radius-lg); 
    object-fit: cover; border: 4px solid white; box-shadow: var(--shadow);
  }
  .placeholder-lg {
    width: 140px; height: 140px; border-radius: var(--radius-lg);
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: white; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 800;
  }
  .thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; margin-right: 12px; vertical-align: middle; }

  .pill { background: #eff6ff; color: var(--primary); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .hr { height: 1px; background: var(--border); margin: 24px 0; }
</style>
</head>
<body>

<div class="app">
  <header class="app-header">
    <div class="brand">
      <img src="acshslogo.jpg" alt="Logo" width="50" height="50">
      <div>
        <div class="title">myACSHS</div>
        <div class="subtitle">Official Student Records Portal</div>
      </div>
    </div>
    <div style="font-size: 13px; font-weight: 500; color: var(--text-muted);">
      Admin: <span style="color: var(--text-main);">admin / admin123</span>
    </div>
  </header>

  <main id="loginView" class="center-view">
    <div class="card" style="width: 100%; max-width: 400px;">
      <h2 style="margin: 0 0 8px 0; font-weight: 800;">Sign In</h2>
      <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 24px;">Enter your credentials to access your dashboard.</p>
      
      <label>User Role</label>
      <select id="loginRole" style="margin-bottom: 16px;">
        <option value="student">Student</option>
        <option value="admin">Administrator</option>
      </select>

      <label>ID Number / Username</label>
      <input id="loginId" type="text" placeholder="e.g. 12-1234-567" style="margin-bottom: 16px;">

      <label>Password</label>
      <input id="loginPass" type="password" placeholder="••••••••" style="margin-bottom: 24px;">

      <button class="primary" onclick="login()" style="width: 100%;">Access Portal</button>
    </div>
  </main>

  <section id="dashboardView" style="display:none">
    <div class="grid-layout">
      <div class="main-content">
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
            <div>
              <h2 id="userTitle" style="margin:0; font-weight:800;">Welcome Back</h2>
              <div id="userMeta" class="subtitle">System Dashboard</div>
            </div>
            <button class="danger" onclick="logout()">Sign Out</button>
          </div>
          
          <div id="tabsArea" class="tabs"></div>
          <div id="mainArea"></div>
        </div>
      </div>

      <aside class="sidebar">
        <div class="card">
          <label style="color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Current Session</label>
          <div style="font-weight: 700; font-size: 18px; margin-bottom: 16px;" id="todayDate"></div>
          <div class="hr" style="margin: 16px 0;"></div>
          <div id="quickStats" style="display: flex; flex-direction: column; gap: 12px;"></div>
        </div>
      </aside>
    </div>
  </section>
</div>

<script>
/* CORE LOGIC & DATA HANDLING */
const LS = { USERS:'csr_users_v1', ATT:'csr_attendance_v1', GRADES:'csr_grades_v1', SCHED:'csr_schedule_v1' };
const ADMIN = { username:'admin', password:'admin123' };

function read(key){ try{ return JSON.parse(localStorage.getItem(key) || 'null'); }catch(e){ return null; } }
function write(key,val){ localStorage.setItem(key, JSON.stringify(val)); }
function fullName(u){ return `${u.firstName} ${u.lastName}`; }
function formatMMDD(birth){ if(!birth) return ''; const p=birth.split('-'); return p.length===3 ? p[1].padStart(2,'0')+p[2].padStart(2,'0') : ''; }

let state = { role:null, user:null };
document.getElementById('todayDate').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

function login(){
  const role = document.getElementById('loginRole').value;
  const id = document.getElementById('loginId').value.trim();
  const pass = document.getElementById('loginPass').value.trim();

  if(role === 'admin'){
    if(id === ADMIN.username && pass === ADMIN.password){
      state = { role: 'admin', user: { username: 'Admin' } };
      openDashboard();
    } else alert('Invalid administrative credentials.');
    return;
  }

  const users = read(LS.USERS) || [];
  const u = users.find(x => x.id === id);
  if(!u) return alert('Student ID not recognized.');
  
  if(pass === `${u.id}-${formatMMDD(u.birth)}`){
    state = { role: 'student', user: u };
    openDashboard();
  } else alert('Incorrect password. Use ID-MMDD format.');
}

function logout(){ 
  state = { role: null, user: null };
  document.getElementById('dashboardView').style.display='none';
  document.getElementById('loginView').style.display='flex';
}

function openDashboard(){
  document.getElementById('loginView').style.display='none';
  document.getElementById('dashboardView').style.display='block';
  renderTabs();
  renderStats();
}

function renderTabs(){
  const area = document.getElementById('tabsArea'); area.innerHTML = '';
  if(state.role === 'admin'){
    createTab('Overview', true, renderAdminHome);
    createTab('Student Directory', false, renderManageStudents);
  } else {
    createTab('My Profile', true, renderStudentProfile);
  }
}

function createTab(label, active, fn){
  const btn = document.createElement('button');
  btn.innerText = label;
  if(active) { btn.className = 'active'; fn(); }
  btn.onclick = (e) => {
    Array.from(area.children).forEach(c => c.classList.remove('active'));
    e.target.classList.add('active');
    fn();
  };
  document.getElementById('tabsArea').appendChild(btn);
}

function renderStats(){
  const users = read(LS.USERS) || [];
  document.getElementById('quickStats').innerHTML = `<div class="pill">Total Students: ${users.length}</div>`;
}

/* VIEWS */
function renderStudentProfile(){
  const u = state.user;
  const avatar = u.avatar ? `<img src="${u.avatar}" class="avatar-lg">` : `<div class="placeholder-lg">${u.firstName[0]}${u.lastName[0]}</div>`;
  document.getElementById('mainArea').innerHTML = `
    <div style="display: flex; gap: 32px; align-items: center; padding: 20px 0;">
      ${avatar}
      <div>
        <h1 style="margin:0; font-size: 32px; font-weight: 800;">${fullName(u)}</h1>
        <p style="font-size: 18px; color: var(--text-muted); margin: 4px 0 16px 0;">${u.track} Student • ${u.id}</p>
        <div class="pill" style="background: #f1f5f9; color: var(--text-main);">Academic Year 2024-2025</div>
      </div>
    </div>
  `;
}

function renderAdminHome(){
  document.getElementById('mainArea').innerHTML = `
    <div style="padding: 40px 0; text-align: center;">
      <h3 style="color: var(--text-muted);">Administrative Console</h3>
      <p>Select "Student Directory" to manage enrollments and photos.</p>
    </div>
  `;
}

function renderManageStudents(){
  const users = read(LS.USERS) || [];
  const rows = users.map((u, i) => `
    <tr>
      <td>${u.avatar ? `<img src="${u.avatar}" class="thumb">` : ''}${u.id}</td>
      <td style="font-weight: 600;">${fullName(u)}</td>
      <td style="text-align: right;">
        <button class="ghost" onclick="uploadPhoto(${i})" style="margin-right: 8px;">Photo</button>
        <button class="danger" onclick="removeStudent(${i})">Delete</button>
      </td>
    </tr>
  `).join('');

  document.getElementById('mainArea').innerHTML = `
    <div style="margin-bottom: 32px;">
      <h4 style="margin-bottom: 16px;">Enroll New Student</h4>
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px;">
        <input id="nId" placeholder="ID Number">
        <input id="nFirst" placeholder="First Name">
        <input id="nLast" placeholder="Last Name">
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;">
        <input id="nTrack" placeholder="Track (e.g. ICT)">
        <input id="nBirth" type="date">
      </div>
      <button class="primary" onclick="addStudent()">Register Student</button>
    </div>
    <div class="hr"></div>
    <table>
      <thead><tr><th>Student ID</th><th>Full Name</th><th style="text-align: right;">Management</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

/* ACTIONS */
function addStudent(){
  const u = { id: nId.value, firstName: nFirst.value, lastName: nLast.value, track: nTrack.value, birth: nBirth.value, avatar: null };
  if(!u.id || !u.firstName) return alert('Basic info required.');
  const list = read(LS.USERS) || []; list.push(u); write(LS.USERS, list);
  renderManageStudents(); renderStats();
}

function uploadPhoto(index){
  const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
  input.onchange = e => {
    const reader = new FileReader();
    reader.onload = ev => {
      const list = read(LS.USERS); list[index].avatar = ev.target.result;
      write(LS.USERS, list); renderManageStudents();
    };
    reader.readAsDataURL(e.target.files[0]);
  };
  input.click();
}

function removeStudent(i){ if(confirm('Permanently delete this record?')){ const list = read(LS.USERS); list.splice(i,1); write(LS.USERS, list); renderManageStudents(); renderStats(); } }
</script>

</body>
</html>
