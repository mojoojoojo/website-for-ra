<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>myACSHS | Secure Student Portal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #000000;
            --bg: #ffffff;
            --surface: #f8fafc;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --error: #ef4444;
            --p-size: 110px; /* Strict 4x4 Ratio */
        }

        /* RESET & BASE */
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            line-height: 1.5;
            padding-bottom: 50px;
        }

        .container { width: 100%; max-width: 500px; margin: 0 auto; padding: 15px; }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 25px;
        }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-area img { width: 35px; height: 35px; border-radius: 6px; }
        .logo-area span { font-weight: 800; font-size: 20px; }

        /* AUTH PANELS */
        .panel { display: none; animation: fadeIn 0.3s ease; }
        .panel.active { display: block; }
        
        .card-header { text-align: center; margin-bottom: 25px; }
        .card-header h1 { font-size: 26px; font-weight: 800; }
        .card-header p { color: var(--muted); font-size: 14px; }

        .form-group { margin-bottom: 18px; position: relative; }
        .form-group label { 
            display: block; font-size: 11px; font-weight: 700; color: var(--muted); 
            text-transform: uppercase; margin-bottom: 6px; 
        }
        
        input, select {
            width: 100%; height: 50px; padding: 0 15px; border-radius: 10px;
            border: 1px solid var(--border); font-size: 16px; background: var(--surface);
            outline: none; transition: 0.2s;
        }
        input:focus { border-color: var(--primary); background: #fff; }

        /* SHOW/HIDE PASSWORD */
        .pass-box { position: relative; }
        .pass-toggle {
            position: absolute; right: 15px; top: 15px; color: var(--muted);
            cursor: pointer; font-size: 18px;
        }

        .btn {
            width: 100%; height: 50px; border-radius: 10px; border: none;
            font-weight: 700; font-size: 15px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-black { background: var(--primary); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-link { background: none; color: var(--muted); font-size: 13px; text-decoration: underline; margin-top: 15px; }

        /* DASHBOARD MOBILE OPTIMIZATION */
        .profile-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 30px;
            gap: 15px;
        }
        .avatar-box {
            width: var(--p-size); height: var(--p-size);
            border-radius: 15px;
            background: var(--surface);
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-box i { font-size: 45px; color: #cbd5e1; }

        .user-info h2 { font-size: 22px; font-weight: 800; }
        .user-info p { color: var(--muted); font-size: 14px; }

        /* TABS */
        .tab-bar { 
            display: flex; gap: 20px; border-bottom: 1px solid var(--border); 
            margin-bottom: 20px; overflow-x: auto; 
        }
        .tab-bar button {
            padding: 10px 0; border: none; background: none; cursor: pointer;
            font-size: 13px; font-weight: 700; color: var(--muted);
            border-bottom: 3px solid transparent; white-space: nowrap;
        }
        .tab-bar button.active { color: var(--primary); border-bottom-color: var(--primary); }

        /* DATA CARDS */
        .item-card {
            background: var(--surface);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-text b { display: block; font-size: 14px; }
        .item-text span { font-size: 12px; color: var(--muted); }

        /* DIRECTORY TABLE */
        .table-holder { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: #fff; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 12px; background: #fafafa; color: var(--muted); font-size: 10px; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid var(--surface); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-area">
            <img src="acshslogo.jpg" alt="Logo">
            <span>myACSHS</span>
        </div>
        <button class="btn-outline" id="logOut" style="display:none; width:auto; height:32px; padding:0 10px; font-size:11px; border-radius:6px;" onclick="app.logout()">Logout</button>
    </header>

    <div id="panelLogin" class="panel active">
        <div class="card-header">
            <h1>Login</h1>
            <p>Welcome back, Student</p>
        </div>
        <div class="form-group">
            <label>Login As</label>
            <select id="liRole"><option value="student">Student</option><option value="admin">Administrator</option></select>
        </div>
        <div class="form-group">
            <label>ID Number (8 Digits)</label>
            <input type="number" id="liId" oninput="ui.limit(this, 8)" placeholder="XXXXXXXX">
        </div>
        <div class="form-group">
            <label>Password</label>
            <div class="pass-box">
                <input type="password" id="liPass" placeholder="••••••••">
                <i class="fa-solid fa-eye-slash pass-toggle" onclick="ui.toggleMask('liPass', this)"></i>
            </div>
        </div>
        <button class="btn btn-black" onclick="app.login()">Sign In</button>
        <button class="btn btn-link" onclick="ui.show('panelReg')">Create an Account</button>
        <button class="btn btn-link" style="margin-top:0" onclick="ui.show('panelForgot')">Forgot Password?</button>
    </div>

    <div id="panelReg" class="panel">
        <div class="card-header">
            <h1>Register</h1>
            <p>Create your portal account</p>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
            <div class="form-group"><label>First Name</label><input id="rgF"></div>
            <div class="form-group"><label>Last Name</label><input id="rgL"></div>
        </div>
        <div class="form-group">
            <label>Student ID (8 Digits)</label>
            <input type="number" id="rgId" oninput="ui.limit(this, 8)">
        </div>
        <div class="form-group">
            <label>Enrollment Slip (6 Digits)</label>
            <input type="number" id="rgSlip" oninput="ui.limit(this, 6)">
        </div>
        <div class="form-group"><label>Track</label><input id="rgTrack" placeholder="ICT 1202"></div>
        <div class="form-group">
            <label>Password</label>
            <div class="pass-box">
                <input type="password" id="rgPass">
                <i class="fa-solid fa-eye-slash pass-toggle" onclick="ui.toggleMask('rgPass', this)"></i>
            </div>
        </div>
        <button class="btn btn-black" onclick="app.register()">Create Account</button>
        <button class="btn btn-link" onclick="ui.show('panelLogin')">Back to Login</button>
    </div>

    <div id="panelForgot" class="panel">
        <div class="card-header"><h1>Reset</h1><p>Verify your details</p></div>
        <div class="form-group"><label>8-Digit ID</label><input type="number" id="fId" oninput="ui.limit(this, 8)"></div>
        <div class="form-group"><label>6-Digit Slip</label><input type="number" id="fSlip" oninput="ui.limit(this, 6)"></div>
        <div class="form-group"><label>New Password</label><input type="password" id="fPass"></div>
        <button class="btn btn-black" onclick="app.reset()">Update Password</button>
        <button class="btn btn-link" onclick="ui.show('panelLogin')">Cancel</button>
    </div>

    <div id="panelDash" class="panel">
        <div class="profile-hero">
            <div id="uPic" class="avatar-box"></div>
            <div class="user-info">
                <h2 id="uName">...</h2>
                <p id="uMeta">...</p>
            </div>
        </div>

        <nav class="tab-bar" id="tabNav"></nav>
        <div id="tabContent"></div>
    </div>
</div>

<script>
    // Security Config
    const SLIP_WHITELIST = ["112233", "445566", "123456", "654321"];

    const db = {
        save: (k, v) => localStorage.setItem('acshs_v9_'+k, JSON.stringify(v)),
        get: (k) => JSON.parse(localStorage.getItem('acshs_v9_'+k) || '[]'),
        sess: {
            set: (u) => localStorage.setItem('acshs_active', JSON.stringify(u)),
            get: () => JSON.parse(localStorage.getItem('acshs_active')),
            kill: () => localStorage.removeItem('acshs_active')
        }
    };

    const ui = {
        show: (id) => {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0,0);
        },
        toggleMask: (id, el) => {
            const f = document.getElementById(id);
            const isP = f.type === 'password';
            f.type = isP ? 'text' : 'password';
            el.className = `fa-solid fa-eye${isP ? '' : '-slash'} pass-toggle`;
        },
        limit: (el, max) => {
            if(el.value.length > max) el.value = el.value.slice(0, max);
        }
    };

    const app = {
        me: null,
        init: () => {
            const s = db.sess.get();
            if(s) { app.me = s; app.launch(); }
        },
        register: () => {
            const id = rgId.value, slip = rgSlip.value;
            if(id.length !== 8 || slip.length !== 6) return alert("Error: ID (8 digits) & Slip (6 digits) required.");
            if(!SLIP_WHITELIST.includes(slip)) return alert("Security: Invalid Enrollment Slip.");
            
            const users = db.get('u');
            if(users.some(x => x.id === id)) return alert("ID already exists.");

            users.push({ id, f:rgF.value, l:rgL.value, s:slip, t:rgTrack.value, p:rgPass.value, pic:null });
            db.save('u', users);
            alert("Registered Successfully!");
            ui.show('panelLogin');
        },
        login: () => {
            const r = liRole.value, id = liId.value, p = liPass.value;
            if(r === 'admin' && id === 'admin' && p === 'admin123') {
                app.me = { role:'admin', name:'Faculty Admin', id:'ADMIN' };
            } else {
                const u = db.get('u').find(x => x.id === id && x.p === p);
                if(!u) return alert("Invalid ID or Password");
                app.me = { role:'student', ...u, name: u.f+' '+u.l };
            }
            db.sess.set(app.me); app.launch();
        },
        reset: () => {
            let users = db.get('u');
            const idx = users.findIndex(x => x.id === fId.value && x.s === fSlip.value);
            if(idx === -1) return alert("Identity Verification Failed.");
            users[idx].p = fPass.value;
            db.save('u', users);
            alert("Password Updated.");
            ui.show('panelLogin');
        },
        launch: () => {
            ui.show('panelDash');
            document.getElementById('logOut').style.display = 'block';
            uName.innerText = app.me.name;
            uMeta.innerText = app.me.role === 'admin' ? 'Administrative Access' : `ID: ${app.me.id} | ${app.me.t}`;
            uPic.innerHTML = app.me.pic ? `<img src="${app.me.pic}">` : `<i class="fa-solid fa-user-graduate"></i>`;
            app.tabs();
        },
        tabs: () => {
            const nav = document.getElementById('tabNav'); nav.innerHTML = '';
            const menu = app.me.role === 'admin' 
                ? [['Students', app.viewDir], ['Portal Settings', () => tabContent.innerHTML = 'v9.0 Build Stable']]
                : [['Schedule', app.viewSched], ['Grades', () => tabContent.innerHTML = 'Verifying Grade Sheets...']];
            
            menu.forEach(([l, f], i) => {
                const b = document.createElement('button'); b.innerText = l;
                if(i===0) { b.classList.add('active'); f(); }
                b.onclick = (e) => { 
                    document.querySelectorAll('.tab-bar button').forEach(x=>x.classList.remove('active'));
                    e.target.classList.add('active'); f(); 
                };
                nav.appendChild(b);
            });
        },
        viewDir: () => {
            const u = db.get('u');
            tabContent.innerHTML = `<div class="table-holder"><table><thead><tr><th>Student</th><th>ID</th><th>Action</th></tr></thead><tbody>` + 
                u.map((x, i) => `<tr><td><b>${x.f} ${x.l}</b><br><small>${x.t}</small></td><td>${x.id}</td><td><button onclick="app.adminUp(${i})" style="font-size:10px; padding:5px">Photo</button></td></tr>`).join('') + `</tbody></table></div>`;
        },
        viewSched: () => {
            const s = [{t:'6:15-7:15', n:'MIL / Homeroom'}, {t:'7:15-8:15', n:'JAVA Programming'}, {t:'8:35-11:35', n:'Work Immersion / III'}];
            tabContent.innerHTML = s.map(x => `<div class="item-card"><div class="item-text"><b>${x.n}</b><span>Time: ${x.t}</span></div><i class="fa-solid fa-clock" style="color:#e2e8f0"></i></div>`).join('');
        },
        adminUp: (idx) => {
            const p = document.createElement('input'); p.type = 'file'; p.accept = 'image/*';
            p.onchange = e => {
                const r = new FileReader();
                r.onload = ev => {
                    let u = db.get('u'); u[idx].pic = ev.target.result; db.save('u', u);
                    if(app.me.id === u[idx].id) { app.me.pic = ev.target.result; db.sess.set(app.me); }
                    app.launch();
                };
                r.readAsDataURL(e.target.files[0]);
            };
            p.click();
        },
        logout: () => { db.sess.kill(); location.reload(); }
    };
    app.init();
</script>
</body>
</html>
